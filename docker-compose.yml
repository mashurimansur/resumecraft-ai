services:
  resumecraft-ai:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_AI_BASE_URL: ${VITE_AI_BASE_URL:-https://9router.codehuri.my.id/v1}
        VITE_AI_API_KEY: ${VITE_AI_API_KEY:-}
        VITE_AI_MODEL: ${VITE_AI_MODEL:-ag/gemini-3.8-flash}
    container_name: resumecraft-ai
    image: resumecraft-ai:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
