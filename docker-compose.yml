services:
  resumecraft-ai:
    image: ghcr.io/mashurimansur/resumecraft-ai:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_AI_BASE_URL: ${VITE_AI_BASE_URL:-https://api.openai.com/v1}
        VITE_AI_API_KEY: ${VITE_AI_API_KEY:-}
        VITE_AI_MODEL: ${VITE_AI_MODEL:-gpt-4o-mini}
    container_name: resumecraft-ai
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    environment:
      - VITE_AI_BASE_URL=${VITE_AI_BASE_URL:-https://api.openai.com/v1}
      - VITE_AI_API_KEY=${VITE_AI_API_KEY:-}
      - VITE_AI_MODEL=${VITE_AI_MODEL:-gpt-4o-mini}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
